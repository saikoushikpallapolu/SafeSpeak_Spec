<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SafeSpeak Socket Debug</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    body { font-family: monospace; background: #0e1628; color: #c2c8cc; padding: 20px; }
    h2 { color: #4ade80; }
    .log { margin: 4px 0; }
    .ok { color: #4ade80; }
    .err { color: #f87171; }
    .warn { color: #facc15; }
    .info { color: #60a5fa; }
    button { margin: 8px 4px; padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; }
    #join-btn { background: #4ade80; color: #000; }
    #leave-btn { background: #f87171; color: #fff; }
    input { background: #1c2333; color: #fff; border: 1px solid #3a4a6b; padding: 8px; border-radius: 6px; width: 200px; }
  </style>
</head>
<body>
  <h2>🔧 SafeSpeak Socket Debug Panel</h2>
  <p id="status" class="warn">● Connecting…</p>
  <p id="sid" class="info">Socket ID: —</p>
  
  <div style="margin: 16px 0;">
    <input id="char-id" value="owl" placeholder="character id" />
    <button id="join-btn" onclick="joinQueue()">Join Queue</button>
    <button id="leave-btn" onclick="leaveQueue()">Leave Queue</button>
  </div>

  <h3>Log:</h3>
  <div id="log"></div>

  <script>
    const BACKEND = 'https://safespeak-backend-mv7h.onrender.com'
    const socket = io(BACKEND, { transports: ['websocket', 'polling'] })

    function log(msg, cls = 'info') {
      const el = document.getElementById('log')
      const line = document.createElement('div')
      line.className = 'log ' + cls
      line.textContent = `[${new Date().toISOString().slice(11,19)}] ${msg}`
      el.prepend(line)
    }

    socket.on('connect', () => {
      document.getElementById('status').textContent = '● Connected ✅'
      document.getElementById('status').className = 'ok'
      document.getElementById('sid').textContent = 'Socket ID: ' + socket.id
      log('✅ Connected to Render backend! Socket ID: ' + socket.id, 'ok')
    })

    socket.on('connect_error', (err) => {
      document.getElementById('status').textContent = '● Connection Error ❌'
      document.getElementById('status').className = 'err'
      log('❌ Connection error: ' + err.message, 'err')
    })

    socket.on('disconnect', (reason) => {
      document.getElementById('status').textContent = '● Disconnected ⚠️'
      document.getElementById('status').className = 'warn'
      log('⚠️ Disconnected: ' + reason, 'warn')
    })

    socket.on('match_found', (payload) => {
      log('🎉 MATCH FOUND! roomId: ' + payload.roomId + ' | peer: ' + payload.peerTag + ' | simulated: ' + payload.isSimulatedPeer, 'ok')
      alert('🎉 MATCHED! Room: ' + payload.roomId + '\nPeer: ' + payload.peerTag)
    })

    function joinQueue() {
      const charId = document.getElementById('char-id').value || 'owl'
      const payload = {
        characterId: charId,
        characterTag: charId + '#' + Math.floor(1000 + Math.random() * 9000),
        checkin: { topics: ['exam'], heaviness: 3, languages: ['English'] },
        preferredLanguages: ['English'],
      }
      log('📤 Emitting join_queue: ' + JSON.stringify(payload), 'info')
      socket.emit('join_queue', payload)
    }

    function leaveQueue() {
      socket.emit('leave_queue')
      log('📤 Emitting leave_queue', 'warn')
    }

    log('Connecting to: ' + BACKEND, 'info')
  </script>
</body>
</html>
